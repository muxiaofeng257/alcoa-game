<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>ALCOA+ 配对挑战</title>
<style>
:root{--green:#16b77a;--green2:#0aa58d;--blue:#1aa9cf;--dark:#053c3a;--card:#ffffff;--line:#c8d6df;--ok:#17a85c;--bad:#e14b5a;--gold:#f7c948}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Arial,sans-serif;background:linear-gradient(135deg,var(--blue),#19bf74);color:#062b2a;min-height:100vh}.wrap{max-width:980px;margin:auto;padding:16px 12px 22px}.head{color:#fff;margin:0 0 10px;font-size:24px;font-weight:900;text-shadow:0 2px 8px rgba(0,0,0,.18)}.btns{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}.btn{border:0;border-radius:13px;padding:10px 13px;background:#fff;color:#06443e;font-weight:850;box-shadow:0 4px 12px rgba(0,0,0,.12)}.btn.secondary{background:rgba(255,255,255,.55)}.rules{background:#f4fbff;border-radius:13px;padding:10px 12px;font-weight:800;margin:0 0 10px;cursor:pointer}.rulesDetail{display:none;background:rgba(255,255,255,.9);border-radius:13px;padding:10px 12px;margin:-4px 0 10px;font-size:13px;line-height:1.5}.rulesDetail.show{display:block}.grid{display:grid;grid-template-columns:1fr;gap:10px}.panel{background:rgba(255,255,255,.93);border-radius:14px;overflow:hidden;box-shadow:0 10px 25px rgba(0,0,0,.14)}.title{padding:9px 11px;font-weight:900;border-bottom:1px solid rgba(0,0,0,.08)}.list{padding:12px;display:grid;gap:8px}.term,.def{border-radius:11px;min-height:52px;display:flex;align-items:center;padding:10px 12px;touch-action:manipulation;transition:.15s}.term{background:linear-gradient(180deg,#59cd81,#39b96c);color:white;font-weight:900;box-shadow:0 4px 10px rgba(0,0,0,.1);justify-content:space-between}.term small{display:block;font-size:12px}.def{background:#f8fbff;border:2px dashed var(--line);font-size:14px;line-height:1.4}.selected{outline:4px solid rgba(247,201,72,.75);transform:translateY(-1px)}.matched{background:#ddf7e9!important;border-color:#37b979!important;color:#07633e!important;box-shadow:none}.wrong{background:#ffe7eb!important;border-color:var(--bad)!important;color:#8b1826!important;animation:shake .25s}@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}.barBox{background:#063e40;border-radius:18px;padding:8px 10px;margin-top:10px;color:white;display:flex;align-items:center;gap:10px;font-weight:850;font-size:14px}.progress{height:8px;background:rgba(255,255,255,.22);border-radius:99px;flex:1;overflow:hidden}.progress>div{height:100%;width:0;background:linear-gradient(90deg,var(--gold),#28cf7b);transition:.25s}.toast{position:fixed;left:50%;bottom:25px;transform:translateX(-50%);padding:12px 16px;border-radius:18px;background:#07433d;color:white;font-weight:900;box-shadow:0 10px 25px rgba(0,0,0,.18);opacity:0;pointer-events:none;transition:.2s;z-index:10;max-width:92%;text-align:center}.toast.show{opacity:1;bottom:38px}.toast.ok{background:#098b55}.toast.bad{background:#c93e4e}.modal{position:fixed;inset:0;background:rgba(0,0,0,.48);display:none;align-items:center;justify-content:center;padding:16px;z-index:20}.modal.show{display:flex}.card{background:white;border-radius:22px;padding:22px;width:100%;max-width:390px;text-align:center;box-shadow:0 12px 35px rgba(0,0,0,.2)}.rank{font-size:36px;font-weight:1000;color:var(--gold);margin:6px 0}.result{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}.result div{background:#eaf8f3;border-radius:14px;padding:10px}.result b{display:block;color:#06443e;font-size:22px}.foot{text-align:center;color:white;font-size:12px;margin-top:9px;opacity:.9}@media(min-width:760px){.grid{grid-template-columns:1fr 1fr}.wrap{padding-top:22px}.head{font-size:28px}.term,.def{min-height:56px}}</style>
</head>
<body><div class="wrap">
<h1 class="head">ALCOA+ 配对挑战</h1>
<div class="btns"><button class="btn" id="start">开始游戏</button><button class="btn secondary" id="hint">提示一次</button><button class="btn secondary" id="sound">静音/恢复</button><button class="btn secondary" id="reset">重置</button></div>
<div class="rules" id="rulesBtn">游戏规则（点击展开/折叠）</div>
<div class="rulesDetail" id="rules">点击一个“原则”，再点击对应“解释”。答对变绿，答错会提示。完成后显示个人得分和用时。</div>
<div class="grid"><div class="panel"><div class="title">原则</div><div class="list" id="terms"></div></div><div class="panel"><div class="title">解释</div><div class="list" id="defs"></div></div></div>
<div class="barBox"><span>⏱ 时间：<span id="time">00:00</span></span><span>✅ 得分：<span id="score">0/9</span></span><div class="progress"><div id="bar"></div></div></div>
<div class="foot">© 单文件手机网页版 | ALCOA+ 培训互动</div>
</div><div class="toast" id="toast"></div>
<div class="modal" id="modal"><div class="card"><h2>挑战完成！</h2><div class="rank" id="rank">DI Expert</div><div class="result"><div><b id="finalTime">00:00</b>用时</div><div><b id="finalMistakes">0</b>错误</div></div><p>你已完成 ALCOA+ 配对挑战。可以截图成绩用于培训互动。</p><button class="btn" id="again">再玩一次</button></div></div>
<script>
const pairs=[
{id:'A',en:'Available',cn:'可用',def:'数据在整个生命周期内能够随时被访问和使用'},
{id:'O',en:'Original',cn:'原始',def:'保留原始数据及修改轨迹，不可随意删除替换'},
{id:'C3',en:'Consistent',cn:'一致',def:'数据时间线、逻辑关系无矛盾'},
{id:'A2',en:'Accurate',cn:'准确性',def:'数据真实无误，与实际操作一致，无伪造篡改'},
{id:'C1',en:'Contemporaneous',cn:'同步',def:'操作发生时实时记录，禁止事后补填、倒填'},
{id:'L',en:'Legible',cn:'易读',def:'记录清晰可辨，电子数据可读取，纸质记录无涂改模糊'},
{id:'E',en:'Enduring',cn:'持久',def:'数据在整个生命周期内能够持续存在'},
{id:'C2',en:'Complete',cn:'完整',def:'所有相关数据均留存，无选择性记录'},
{id:'AT',en:'Attributable',cn:'可归属性',def:'所有数据和记录都能指向具体个人，明确“谁做的”'}
];
let selectedTerm=null,selectedDef=null,matched=0,mistakes=0,startAt=0,timer=null,soundOn=true,hintUsed=false;const $=id=>document.getElementById(id);function shuffle(a){return a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1])}function fmt(s){let m=Math.floor(s/60),r=s%60;return String(m).padStart(2,'0')+':'+String(r).padStart(2,'0')}function beep(ok=true){if(!soundOn)return;try{let c=new(window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=ok?720:180;g.gain.value=.04;o.start();setTimeout(()=>{o.stop();c.close()},ok?80:150)}catch(e){}}function msg(t,ok=true){let el=$('toast');el.textContent=t;el.className='toast show '+(ok?'ok':'bad');setTimeout(()=>el.className='toast',950)}function render(){$('terms').innerHTML='';$('defs').innerHTML='';shuffle(pairs).forEach(p=>{let d=document.createElement('div');d.className='term';d.dataset.id=p.id;d.innerHTML=`<div>${p.en}<small>${p.cn}</small></div>`;d.onclick=()=>pickTerm(d,p.id);$('terms').appendChild(d)});shuffle(pairs).forEach(p=>{let d=document.createElement('div');d.className='def';d.dataset.id=p.id;d.textContent=p.def;d.onclick=()=>pickDef(d,p.id);$('defs').appendChild(d)});update()}function start(){clearInterval(timer);matched=0;mistakes=0;selectedTerm=null;selectedDef=null;hintUsed=false;startAt=Date.now();$('modal').classList.remove('show');render();timer=setInterval(()=>{$('time').textContent=fmt(Math.floor((Date.now()-startAt)/1000))},500);msg('游戏开始！',true)}function pickTerm(el,id){if(el.classList.contains('matched'))return;document.querySelectorAll('.term').forEach(x=>x.classList.remove('selected'));el.classList.add('selected');selectedTerm={el,id};check()}function pickDef(el,id){if(el.classList.contains('matched'))return;document.querySelectorAll('.def').forEach(x=>x.classList.remove('selected'));el.classList.add('selected');selectedDef={el,id};check()}function check(){if(!selectedTerm||!selectedDef)return;if(selectedTerm.id===selectedDef.id){selectedTerm.el.classList.remove('selected');selectedDef.el.classList.remove('selected');selectedTerm.el.classList.add('matched');selectedDef.el.classList.add('matched');matched++;beep(true);msg('答对了！',true);selectedTerm=null;selectedDef=null;update();if(matched===pairs.length)finish()}else{mistakes++;beep(false);selectedTerm.el.classList.add('wrong');selectedDef.el.classList.add('wrong');msg('不匹配，再试一次。',false);setTimeout(()=>{if(selectedTerm)selectedTerm.el.classList.remove('selected','wrong');if(selectedDef)selectedDef.el.classList.remove('selected','wrong');selectedTerm=null;selectedDef=null},420)}}function update(){$('score').textContent=matched+'/'+pairs.length;$('bar').style.width=(matched/pairs.length*100)+'%'}function finish(){clearInterval(timer);let sec=Math.floor((Date.now()-startAt)/1000);$('finalTime').textContent=fmt(sec);$('finalMistakes').textContent=mistakes;let rank='DI Expert';if(mistakes>2||sec>180)rank='DI Learner';else if(mistakes>0||sec>110)rank='DI Champion';$('rank').textContent=rank;$('modal').classList.add('show')}function giveHint(){if(hintUsed){msg('提示已经用过啦。',false);return}hintUsed=true;let remain=[...document.querySelectorAll('.term:not(.matched)')];if(!remain.length)return;let t=remain[0],id=t.dataset.id,d=document.querySelector('.def[data-id="'+id+'"]:not(.matched)');t.classList.add('selected');d.classList.add('selected');msg('高亮的是一组正确配对。',true);setTimeout(()=>{t.classList.remove('selected');d.classList.remove('selected')},1400)}$('start').onclick=start;$('reset').onclick=start;$('again').onclick=start;$('hint').onclick=giveHint;$('sound').onclick=()=>{soundOn=!soundOn;msg(soundOn?'声音已开启':'已静音',true)};$('rulesBtn').onclick=()=>$('rules').classList.toggle('show');render();</script></body></html>
